[phases.setup]
nixPkgs = [
  "chromium",
  "nss",
  "atk",
  "at-spi2-atk",
  "libdrm",
  "xorg.libxcomposite",
  "xorg.libxdamage",
  "xorg.libxfixes",
  "xorg.libxrandr",
  "mesa",
  "alsa-lib",
  "pango",
  "cairo",
  "nspr",
  "gbm"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium"
]

[start]
cmd = "python subs.py"